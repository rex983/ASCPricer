<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Steel building silhouette -->
  <rect x="4" y="16" width="32" height="20" rx="1" fill="#2563EB"/>
  <!-- Roof (A-frame) -->
  <path d="M2 17L20 4L38 17H2Z" fill="#1D4ED8"/>
  <!-- Roof ridge line -->
  <path d="M20 4L20 17" stroke="#3B82F6" stroke-width="1"/>
  <!-- Building door -->
  <rect x="15" y="24" width="10" height="12" rx="0.5" fill="#1E40AF"/>
  <!-- Roll-up door lines -->
  <line x1="15" y1="27" x2="25" y2="27" stroke="#2563EB" stroke-width="0.5"/>
  <line x1="15" y1="30" x2="25" y2="30" stroke="#2563EB" stroke-width="0.5"/>
  <line x1="15" y1="33" x2="25" y2="33" stroke="#2563EB" stroke-width="0.5"/>
  <!-- Side panels (vertical lines) -->
  <line x1="10" y1="17" x2="10" y2="36" stroke="#1E40AF" stroke-width="0.75"/>
  <line x1="30" y1="17" x2="30" y2="36" stroke="#1E40AF" stroke-width="0.75"/>
  <!-- Roof panel lines -->
  <line x1="8" y1="12.5" x2="8" y2="17" stroke="#2563EB" stroke-width="0.5"/>
  <line x1="14" y1="8.8" x2="14" y2="17" stroke="#2563EB" stroke-width="0.5"/>
  <line x1="26" y1="8.8" x2="26" y2="17" stroke="#2563EB" stroke-width="0.5"/>
  <line x1="32" y1="12.5" x2="32" y2="17" stroke="#2563EB" stroke-width="0.5"/>
</svg>
